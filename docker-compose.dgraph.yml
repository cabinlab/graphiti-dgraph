services:
  dgraph-zero:
    image: dgraph/dgraph:v25.2.0
    ports:
      - "5080:5080"
      - "6080:6080"
    volumes:
      - dgraph_zero_data:/dgraph
    command: dgraph zero --my=dgraph-zero:5080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6080/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  dgraph-alpha:
    image: dgraph/dgraph:v25.2.0
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - dgraph_alpha_data:/dgraph
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --security whitelist=0.0.0.0/0
    depends_on:
      dgraph-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  dgraph_zero_data:
  dgraph_alpha_data:
